<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#f7f8fa"/><text x="55" y="65" font-family="Arial" font-size="30" font-weight="700">RETENTION OPPORTUNITY</text><text x="55" y="95" font-family="Arial" font-size="15" fill="#6b7078">Where the largest churn-rate gaps appear before applying ML prioritization</text><rect x="55" y="135" width="1090" height="485" rx="12" fill="white" stroke="#e1e4e8"/><text x="85" y="180" font-family="Arial" font-size="19" font-weight="700">Churn rate by customer segment</text><text x="90" y="235" font-family="Arial" font-size="15">Electronic check</text><rect x="270" y="211" width="600" height="30" rx="5" fill="#e5e8ec"/><rect x="270" y="211" width="543.48" height="30" rx="5" fill="#343a40"/><text x="900" y="233" font-family="Arial" font-size="15" font-weight="700">45.29%</text><text x="90" y="310" font-family="Arial" font-size="15">Month-to-month</text><rect x="270" y="286" width="600" height="30" rx="5" fill="#e5e8ec"/><rect x="270" y="286" width="512.52" height="30" rx="5" fill="#343a40"/><text x="900" y="308" font-family="Arial" font-size="15" font-weight="700">42.71%</text><text x="90" y="385" font-family="Arial" font-size="15">Fiber optic</text><rect x="270" y="361" width="600" height="30" rx="5" fill="#e5e8ec"/><rect x="270" y="361" width="502.68" height="30" rx="5" fill="#343a40"/><text x="900" y="383" font-family="Arial" font-size="15" font-weight="700">41.89%</text><text x="90" y="460" font-family="Arial" font-size="15">DSL</text><rect x="270" y="436" width="600" height="30" rx="5" fill="#e5e8ec"/><rect x="270" y="436" width="227.52" height="30" rx="5" fill="#343a40"/><text x="900" y="458" font-family="Arial" font-size="15" font-weight="700">18.96%</text><text x="90" y="535" font-family="Arial" font-size="15">One year</text><rect x="270" y="511" width="600" height="30" rx="5" fill="#e5e8ec"/><rect x="270" y="511" width="135.24" height="30" rx="5" fill="#343a40"/><text x="900" y="533" font-family="Arial" font-size="15" font-weight="700">11.27%</text><text x="90" y="590" font-family="Arial" font-size="13" fill="#6b7078">The dashboard identifies where retention attention may be concentrated; ML risk ranking is evaluated separately in the notebook.</text></svg>