<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700">
<rect width="1200" height="700" fill="#f7f8fa"/>
<text x="55" y="65" font-family="Arial" font-size="30" font-weight="700">ML RISK — CUSTOMER PRIORITIZATION</text>
<text x="55" y="95" font-family="Arial" font-size="15" fill="#6b7078">Risk score is used for ranking customers, not as a retention treatment decision</text>
<rect x="55" y="135" width="1090" height="485" rx="12" fill="white" stroke="#e1e4e8"/>
<text x="85" y="180" font-family="Arial" font-size="19" font-weight="700">Risk buckets</text>
<text x="90" y="255" font-family="Arial" font-size="16" font-weight="700">High</text><rect x="190" y="230" width="560" height="45" rx="7" fill="#e7e9ec"/><rect x="190" y="230" width="112.03180462870935" height="45" rx="7" fill="#343a40"/><text x="775" y="260" font-family="Arial" font-size="15">1,409 customers</text><text x="1020" y="260" text-anchor="end" font-family="Arial" font-size="15" font-weight="700">48.6% churn</text><text x="90" y="410" font-family="Arial" font-size="16" font-weight="700">Medium</text><rect x="190" y="385" width="560" height="45" rx="7" fill="#e7e9ec"/><rect x="190" y="385" width="168.00795115717733" height="45" rx="7" fill="#343a40"/><text x="775" y="415" font-family="Arial" font-size="15">2,113 customers</text><text x="1020" y="415" text-anchor="end" font-family="Arial" font-size="15" font-weight="700">27.4% churn</text><text x="90" y="565" font-family="Arial" font-size="16" font-weight="700">Low</text><rect x="190" y="540" width="560" height="45" rx="7" fill="#e7e9ec"/><rect x="190" y="540" width="279.9602442141133" height="45" rx="7" fill="#343a40"/><text x="775" y="570" font-family="Arial" font-size="15">3,521 customers</text><text x="1020" y="570" text-anchor="end" font-family="Arial" font-size="15" font-weight="700">8.1% churn</text>
<text x="85" y="570" font-family="Arial" font-size="14" fill="#6b7078">The useful question is not only “is this customer churn = 1?”</text>
<text x="85" y="595" font-family="Arial" font-size="14" fill="#6b7078">It is “how concentrated is churn among the customers we can actually contact?”</text>
</svg>